version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newtonite_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newtonite-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/newtonite_ops?schema=public"
      PORT: 4000
      JWT_SECRET: "super-secret-jwt-key-newtonite-operations-under-pressure-2026"
      NODE_ENV: "production"
    ports:
      - "4000:4000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: newtonite-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/newtonite_ops?schema=public"
      NODE_ENV: "production"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newtonite-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
